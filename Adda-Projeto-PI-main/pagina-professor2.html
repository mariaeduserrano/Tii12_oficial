<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pagina professor 1</title>
    </head>

    <style>
        
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(237, 231, 217);
        }
        header, footer {
            background-color: rgb(0, 5, 53);
            height: 50px;
            width: 100%;
        }
        header{
            position: sticky;
            z-index: 10;
            top: 0px;
        }
        footer{
            position: sticky;
            bottom: 0px;

        }
        .voltar {
            display: flex;
        }
        #botao-voltar {
            height: 100px;
            width: auto;
            background-color: white;
            border: none;
        }
        #voltar {
            height: 100px;
            width: auto;
        }
        #pranchetinha{
            position: relative;
            height: 400px;
            width: auto;
            top: 60px;
            right: 310px;
            left: 0px;
        }
    
        .principal {
            display: flex;
        }
        .content {
            display: flex;
            left: 350px;
            position: sticky;
    
        }
        .tabela {
            position: relative;
            background-color: rgb(219, 219, 219);
            border: 5px solid;
            border-radius: 30px;
            border-color: rgb(0, 5, 53);
            display: flex;
            flex-direction: column;
            height: 350px;
            width: 400px;
            left: 0px;
            right: 200px;
            gap: 33px;
            padding: 10px;
            top: 10px;

         
        }
        .botoes {
            height: 50px;
            width: 400px;
            border: 3px solid;
            border-color: rgb(0, 5, 53);
            border-radius: 20px;
            font-size: 20px;
            margin: auto;
        }
        .botao-cad {
            height: 50px;
            width: auto;
            border: none;
            background-color: rgb(0, 5, 53);
            color: white;
            font-size: 20px;
            border-radius: 20px;
        }

        .titulo-cadastro {
        text-align: center;
        line-height: 50px;
        height: 80px;
       }
    </style>

    <body>
        <header></header>

        <div class="voltar">
            <a href="primeira-pagina.html"><button id="botao-voltar"><img src="img/web-button-icon-back-button-free-png.webp" alt="" id="voltar"></button></a>
        </div>
        
        <div class="principal">
                
            <div class="content">
                <img src="img/ADDA PRANCHETA1.png" alt="pranchetinha" id="pranchetinha">
                <div class="tabela">

                    <form id="CPF">
                    <input id="CPF" type="text" placeholder="CPF">
                    </form>

                    <form id="Escola">
                    <input id="Escola" type="Text" placeholder="Escola">
                    </form>
                    
                    <form id="Graduaçao">
                    <input id="Graduaçao" id="Text" placeholder="Graduação">
                    </form>

                    <form id="Conhecimento">
                    <input id="Conhecimento" id="text" placeholder="Área de Conhecimento">
                    </form>

                    <form id="Senha">
                    <input id="senha" id="text" placeholder="Senha">
                    </form>

                    <a href="pagina-professor1.html"><button type="submit">Cadastrar</button></a>
                  
                    
                </div>
            </div>

        </div>

    </body>
        <footer></footer>
