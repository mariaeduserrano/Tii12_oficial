<!DOCTYPE html>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: rgb(237, 231, 217);
        }
         header, footer {
            background-color: rgb(0, 5, 53);
            height: 50px;
            width: 100%;
        }
        header{
            position: sticky;
            z-index: 10;
            top: 0px;
        }
        footer{
            position: fixed;
            bottom: 0px;

        }
        .cabecalho {
            display: flex;
            padding: 0px;
        }
        #botao-voltar {
            height: 100px;
            width: auto;
            background-color: rgb(red, green, blue);
            border: none;
        }
        #voltar {
            height: 100px;
            width: auto;
        }
        #texto {
            font-size: 30px;
            gap: 40px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .principal {
            display: flex;
            padding: 10px;
        }
        .tabela {
            position: relative;
            background-color: white;
            border: 5px solid;
            border-radius: 30px;
            border-color: rgb(0, 5, 53);
            display: flex;
            flex-direction: column;
            height: 300px;
            width: 400px;
            gap: 40px;
            padding: 20px;
            left: 240px;
            top: 10px;
            
        }
        #botoes {
            height: 80px;
            width: auto;
            border: 3px solid;
            border-color: rgb(0, 5, 53);
            border-radius: 20px;
            font-size: 20px;
        }
        #cadastrar {
            height: 90px;
            width: auto;
            border: none;
            background-color: rgb(0, 5, 53);
            color: white;
            font-size: 20px;
            border-radius: 20px;
        }
        #pranchetinha {
            position:absolute;
            width: 500px;
            top: 20px;
            left: 750px;
           top: 130px;
        }

        #Cadastrando{
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 300px; 
        margin: 15px;
        padding: 5px;
        border: none;
        }

        #cadastrando input{
            font-size: 20px;
        }

        #Cadastrando input:focus{
        background-color: rgb(209, 209, 209);
       }

       #cadastrar{
        background-color: rgba(255, 243, 110, 0.993);
        width: 200px;
        right:90px;
        height: 50px;
        margin-top: 270px;
        color: black;
        border-color: rgb(184, 0, 0);
        border-bottom: 10px;
        position: relative;
        
       }


    </style>

    <body>
         <header></header>
             
        <div class="cabecalho">
            <a href="pagina-aluno1.html"><button id="botao-voltar"><img src="img/seta.png" alt="voltar" id="voltar"></button></a>
            <p id="texto">Cadastro Alunos</p>
        </div>

         <div class="principal">

            <div class="tabela">

              <form id="Cadastrando">
                <input id="Aluno" type="text" placeholder="Nome completo do aluno">
                <input id="serie" type="text" placeholder="Série">
                <input id="RA" type="text" placeholder="RA">
                <input id="Data-de-nascimento" type="date" placeholder="Data de nascimento">
                <input id="senha" type="text" placeholder="Senha">
              </form>
                </div>
                <a href="pagina-aluno3.html"><button id="cadastrar">Cadastrar</button></a>

            
            <img src="img/AddaPNG.png" alt="pranchetinha" id="pranchetinha">
         </div>
         
    </body>
