<!DOCTYPE html>
<html lang="pt-br">
    <head>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(237, 231, 217);
        }
          header, footer {
            background-color: rgb(0, 5, 53);
            height: 50px;
            width: 100%;
        }
        header{

            z-index: 10;
            top: 0px;
        }
        footer{
            position: fixed;
            bottom: 0px;

        }
        .voltar {
            display: flex;
        }
        #botao-voltar {
            height: 100px;
            width: auto;
            background-color: white;
            border: none;
        }
        #voltar {
            height: 100px;
            width: auto;
        }
        #pranchetinha{
            position: relative;
            width:500px;
            left:60px;
        }
        .principal {
            display: flex;
        }
        .content {
        
            display: flex;
        }
        .tabela {
            position: relative;
            background-color: rgb(255, 255, 255);
            border: 5px solid;
            border-radius: 30px;
            border-color: rgb(0, 5, 53);

            flex-direction: column;

            width: 300px;
            left: 50px;
            gap: 40px;
            padding: 20px;
            top: 50px;
        }

       
        .botoes {
            height: 50px;
            width: auto;
            border: 3px solid;
            border-color: rgb(0, 5, 53);
            border-radius: 20px;
            font-size: 20px;
        }
        #Entrar-btn{
        position: relative;
        background-color: rgb(255, 154, 154);
        left: 60px;
        width: 150px;
        height: 40px;
        font-size: 18px;
        margin-top: 50px;
        border-radius: 15px;
        border-color: black;
       }
    
        #login {
           display: flex;
           flex-direction: column;
           gap: 20px;
           width: 250px;
           height: 30px;
           margin: 5px;
           padding: 5px;
           border: none; 
           font-size: 60px;

        }

        #login input{
            font-size: 20px;
        }

        #login input:focus{
            background-color:rgb(209, 209, 209,) ;
        }

    <body>
        <header></header>

        <div class="voltar">

        <div class="principal">

                <div class="tabela">
                   
                    <form id="login">
                    <input id="CPF-logado" type="text" placeholder="CPF">
                    <input id="Senha-logado" type="text" placeholder="Senha">
                    </form>
<a href="pagina-aluno1.html"><button id="Entrar-btn">Entrar</button></a>
                </div>
            </div>

        <footer></footer>
